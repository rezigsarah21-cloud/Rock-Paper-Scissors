<!DOCTYPE html>
<html lang="en">
  <head>
        <script src="https://kit.fontawesome.com/aaed7d02dd.js" crossorigin="anonymous"></script>
        <meta charset="UTF-8" />
        <meta name="viewporte" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="style.css">
        <title>Rock-Paper-Scissors Program</title>
       
  </head>
  <body>
    <h1 id="myh1">Rock-Paper-Scissors</h1>
    <div id="choices">
       <button onclick="playgame('rock')">👊</button>
       <button onclick="playgame('paper')">🖐️</button>
       <button onclick="playgame('scissors')">✌️</button>
    </div>
    <div id="playerresult">Player:</div>
    <div id="computerresult">Computer:</div>
    <div id="resultdisplay">IT'S A TIE</div>
    <div class="playscore" >PlayerScore:
         <span id="playerscoredisplay">0</span>
    </div>

    <div class="playscore" >ComputerScore:
         <span id="computerscoredisplay">0</span>
    </div>
    
    <script src="index.js"></script>
  </body>
